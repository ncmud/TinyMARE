name: Zig

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Zig / ${{ matrix.os }} / ${{ matrix.optimize }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        optimize: [Debug, ReleaseFast]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Use the macOS Command Line Tools SDK
        if: runner.os == 'macOS'
        run: echo 'DEVELOPER_DIR=/Library/Developer/CommandLineTools' >> "$GITHUB_ENV"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: '0.15.2'
          cache-key: ${{ matrix.optimize }}
      - name: Build
        run: zig build -Doptimize=${{ matrix.optimize }}
      - name: Test server
        run: zig build test -Doptimize=${{ matrix.optimize }}
      - name: Build and test static Linux executable
        if: runner.os == 'Linux' && matrix.optimize == 'ReleaseFast'
        run: |
          zig build -Dtarget=x86_64-linux-musl -Doptimize=ReleaseFast --prefix zig-out-linux
          python3 tests/smoke.py zig-out-linux/bin/netmare
